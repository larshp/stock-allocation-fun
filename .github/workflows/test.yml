name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lints src and sap-stubs, transpiles both to JavaScript and runs the
      # ABAP Unit tests against an in-memory SQLite database
      - run: npm test
